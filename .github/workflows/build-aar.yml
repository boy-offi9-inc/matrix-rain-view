name: Build Library AAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Needs contents: write, which this workflow doesn't grant.
          dependency-graph: disabled

      - name: Assemble library AAR
        run: gradle :matrixrainview:assembleRelease --stacktrace

      - name: Upload library AAR
        uses: actions/upload-artifact@v4
        with:
          name: matrixrainview-release-aar
          path: matrixrainview/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
